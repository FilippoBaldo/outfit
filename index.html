<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outfit</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Outfit">
<meta name="theme-color" content="#F4F1EB">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#F4F1EB; --card:#FFFFFF; --ink:#141414; --mute:#8A857C; --line:#E2DDD3;
  --acc:#141414; --chip:#EAE6DE;
  --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit}
header{position:sticky;top:0;z-index:5;background:rgba(244,241,235,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(var(--st) + 14px) 20px 12px}
h1{margin:0;font-size:30px;letter-spacing:-.02em;font-weight:700}
.sub{color:var(--mute);font-size:13px;margin-top:2px}
main{padding:4px 14px calc(var(--sb) + 100px)}
/* grid */
.grid{columns:2;column-gap:10px}
.tile{break-inside:avoid;margin:0 0 10px;border-radius:14px;overflow:hidden;background:var(--chip);display:block;width:100%;position:relative}
.tile img{display:block;width:100%;height:auto}
.tile .n{position:absolute;left:8px;bottom:8px;background:rgba(20,20,20,.72);color:#fff;font-size:11px;padding:3px 8px;border-radius:20px}
.empty{text-align:center;color:var(--mute);padding:70px 30px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:20px;padding:7px 12px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff}
.chip .x{opacity:.6;margin-left:2px;font-size:16px;line-height:1}
.chip .c{font-size:12px;opacity:.55}
.sw{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none}
.tag{background:var(--card);border:1px solid var(--line)}
.label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:22px 2px 10px}
.btn{display:block;width:100%;background:var(--ink);color:#fff;border-radius:14px;padding:15px;font-weight:600;text-align:center}
.btn.sec{background:var(--chip);color:var(--ink)}
.btn.danger{background:none;color:#B3261E}
.btn:disabled{opacity:.35}
.row{display:flex;gap:10px}
.row>*{flex:1}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.hint{color:var(--mute);font-size:13px}
/* tab bar */
nav{position:fixed;left:12px;right:12px;bottom:calc(var(--sb) + 10px);z-index:10;display:flex;align-items:center;justify-content:space-around;background:rgba(20,20,20,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:26px;height:62px;padding:0 6px}
nav button{color:#9b978f;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;flex:1}
nav button.on{color:#fff}
nav svg{width:23px;height:23px}
nav .add{flex:none;width:48px;height:48px;border-radius:50%;background:var(--bg);color:var(--ink);justify-content:center}
nav .add svg{width:24px;height:24px}
/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.sheet .bar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:calc(var(--st) + 12px) 16px 10px;background:rgba(244,241,235,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.sheet .bar b{font-size:16px}
.sheet .bar button{font-weight:600;padding:6px 4px}
.sheet .body{padding:4px 16px calc(var(--sb) + 30px)}
.hero{width:100%;border-radius:16px;display:block;max-height:62vh;object-fit:contain;background:var(--chip)}
.picker{background:var(--card);border-radius:16px;padding:14px}
.picker .label{margin-top:4px}
.picker .label + .chips{margin-bottom:14px}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.addrow button{background:var(--ink);color:#fff;border-radius:12px;padding:0 16px;font-weight:600}
.note{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 86px);transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:40;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.dialog{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.35);display:none;align-items:flex-end;padding:12px 12px calc(var(--sb) + 12px)}
.dialog.open{display:flex}
.dialog .card{width:100%;margin:0}
.dialog p{margin:2px 0 16px}
.dialog .btn{margin-top:8px}
.count{font-size:14px;color:var(--mute);margin:18px 2px 10px}
</style>
</head>
<body>
<header><h1 id="title">Ispirazioni</h1><div class="sub" id="subtitle"></div></header>
<main id="view"></main>

<nav>
  <button data-tab="gallery" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7.5" height="9" rx="2"/><rect x="13.5" y="3" width="7.5" height="5.5" rx="2"/><rect x="3" y="15" width="7.5" height="6" rx="2"/><rect x="13.5" y="11.5" width="7.5" height="9.5" rx="2"/></svg>Galleria</button>
  <button data-tab="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5" stroke-linecap="round"/></svg>Cerca</button>
  <button class="add" id="addBtn" aria-label="Aggiungi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-tab="tags"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 12.2V4a1 1 0 0 1 1-1h8.2a1 1 0 0 1 .7.3l8 8a1 1 0 0 1 0 1.4l-8.2 8.2a1 1 0 0 1-1.4 0l-8-8a1 1 0 0 1-.3-.7z"/><circle cx="8" cy="8" r="1.6"/></svg>Tag</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Impostazioni</button>
</nav>

<input type="file" id="file" accept="image/*" multiple hidden>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<section class="sheet" id="detail"></section>
<section class="sheet" id="editor"></section>
<div class="dialog" id="dialog"><div class="card" id="dialogCard"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Vocabolario predefinito ---------- */
const DEFAULT_VOCAB = {
  capi: ["maglione","cardigan","felpa","camicia","t-shirt","polo","giacca","blazer","cappotto","piumino","gilet","jeans","pantaloni","chino","shorts","gonna","vestito","sneakers","scarpe","stivali","mocassini","borsa","cappello","sciarpa","cintura","occhiali"],
  colori: ["bianco","panna","beige","cammello","marrone","grigio","antracite","nero","blu","blu navy","azzurro","verde","verde oliva","rosso","bordeaux","rosa","giallo","arancione","viola","chiaro","scuro","fantasia"]
};
const SWATCH = {bianco:"#FFFFFF",panna:"#F3EAD7",beige:"#D9C7A7",cammello:"#B8875A",marrone:"#6B4630",grigio:"#9A9A9A",antracite:"#3E4042",nero:"#111111",blu:"#2F55B5","blu navy":"#1D2A4D",azzurro:"#8DB8E8",verde:"#3F8A4F","verde oliva":"#6B6B3A",rosso:"#C62F2F",bordeaux:"#6E1F2A",rosa:"#EBA9B7",giallo:"#EBC74A",arancione:"#E07B39",viola:"#6D4A9C",chiaro:"#BFD3E6",scuro:"#2C3A52",fantasia:"conic-gradient(#C62F2F,#EBC74A,#3F8A4F,#2F55B5,#C62F2F)"};

/* ---------- IndexedDB ---------- */
const dbp = new Promise((res, rej) => {
  const r = indexedDB.open("outfit-ispirazioni", 1);
  r.onupgradeneeded = () => { r.result.createObjectStore("photos", {keyPath:"id"}); r.result.createObjectStore("meta"); };
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
async function run(store, mode, fn){
  const db = await dbp;
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode); const req = fn(t.objectStore(store));
    t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error);
  });
}
const dbAll = () => run("photos","readonly",s=>s.getAll());
const dbPut = p => run("photos","readwrite",s=>s.put(p));
const dbDel = id => run("photos","readwrite",s=>s.delete(id));
const metaGet = k => run("meta","readonly",s=>s.get(k));
const metaPut = (k,v) => run("meta","readwrite",s=>s.put(v,k));

/* ---------- Stato ---------- */
let photos = [], vocab = structuredClone(DEFAULT_VOCAB), tab = "gallery", filters = [], pick = {capo:null, colore:null}, building = false;
const urls = new Map();
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const urlOf = p => { if(!urls.has(p.id)) urls.set(p.id, URL.createObjectURL(p.blob)); return urls.get(p.id); };
const tagKey = t => t.capo + "|" + t.colore;
const tagLabel = t => (t.capo || "qualsiasi capo") + " · " + (t.colore || "qualsiasi colore");
function swatch(c){ const v = SWATCH[c]; if(!v) return ""; return `<span class="sw" style="background:${v}"></span>`; }
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800); }

/* ---------- Filtri ---------- */
const matchOne = (p, f) => p.tags.some(t => (!f.capo || t.capo===f.capo) && (!f.colore || t.colore===f.colore));
const applyFilters = list => list.filter(p => filters.every(f => matchOne(p,f)));
function usedTags(){
  const m = new Map();
  photos.forEach(p => p.tags.forEach(t => { const k=tagKey(t); m.set(k, {t, n:(m.get(k)?.n||0)+1}); }));
  return [...m.values()].sort((a,b)=>b.n-a.n);
}

/* ---------- Render ---------- */
function gridHTML(list){
  return `<div class="grid">${list.map(p=>`<button class="tile" data-open="${p.id}"><img src="${urlOf(p)}" loading="lazy" alt=""><span class="n">${p.tags.length} tag</span></button>`).join("")}</div>`;
}
function render(){
  document.querySelectorAll("nav [data-tab]").forEach(b=>b.classList.toggle("on", b.dataset.tab===tab));
  const v = $("#view");
  const sorted = [...photos].sort((a,b)=>b.created-a.created);
  if(tab==="gallery"){
    $("#title").textContent="Ispirazioni";
    $("#subtitle").textContent = photos.length ? `${photos.length} foto` : "";
    v.innerHTML = photos.length ? gridHTML(sorted)
      : `<div class="empty"><b>Nessuna ispirazione</b>Tocca + per caricare la prima foto dal rullino.</div>`;
  }
  if(tab==="search"){
    $("#title").textContent="Cerca"; $("#subtitle").textContent="Combina più filtri: devono esserci tutti";
    const res = applyFilters(sorted);
    v.innerHTML = `
      <div class="label">Filtri attivi</div>
      <div class="chips">${filters.map((f,i)=>`<button class="chip on" data-rmf="${i}">${swatch(f.colore)}${esc(tagLabel(f))}<span class="x">×</span></button>`).join("")}<button class="chip tag" id="toggleBuilder">${building?"Chiudi":"+ Filtro"}</button></div>
      ${building ? `<div class="picker" style="margin-top:14px">
      <div class="label">Capo</div>
      <div class="chips">${vocab.capi.map(c=>`<button class="chip ${pick.capo===c?"on":""}" data-sc="${esc(c)}">${esc(c)}</button>`).join("")}</div>
      <div class="label">Colore</div>
      <div class="chips">${vocab.colori.map(c=>`<button class="chip ${pick.colore===c?"on":""}" data-sk="${esc(c)}">${swatch(c)}${esc(c)}</button>`).join("")}</div>
      <button class="btn" id="addFilter" ${!pick.capo&&!pick.colore?"disabled":""}>Aggiungi filtro${pick.capo||pick.colore?": "+esc(tagLabel(pick)):""}</button>
      <p class="hint" style="margin:10px 2px 0">Puoi scegliere solo il capo (tutti i jeans) o solo il colore (tutto il bianco).</p></div>` : ""}
      <div class="count">${filters.length ? `${res.length} risultat${res.length===1?"o":"i"}` : `Tutte le foto (${res.length})`}</div>
      ${res.length ? gridHTML(res) : `<div class="empty">Nessuna foto con questa combinazione.</div>`}`;
  }
  if(tab==="tags"){
    $("#title").textContent="Tag"; $("#subtitle").textContent="Tocca un tag per vedere le foto";
    const u = usedTags();
    v.innerHTML = u.length ? `<div class="label">Usati</div><div class="chips">${u.map(({t,n})=>`<button class="chip tag" data-go="${esc(tagKey(t))}">${swatch(t.colore)}${esc(t.capo)} · ${esc(t.colore)} <span class="c">${n}</span></button>`).join("")}</div>
      <div class="label">Per capo</div><div class="chips">${[...new Set(u.map(x=>x.t.capo))].map(c=>`<button class="chip" data-gocapo="${esc(c)}">${esc(c)} <span class="c">${photos.filter(p=>p.tags.some(t=>t.capo===c)).length}</span></button>`).join("")}</div>
      <div class="label">Per colore</div><div class="chips">${[...new Set(u.map(x=>x.t.colore))].map(c=>`<button class="chip" data-gocol="${esc(c)}">${swatch(c)}${esc(c)} <span class="c">${photos.filter(p=>p.tags.some(t=>t.colore===c)).length}</span></button>`).join("")}</div>`
      : `<div class="empty"><b>Ancora nessun tag</b>I tag compaiono qui quando li assegni alle foto.</div>`;
  }
  if(tab==="settings"){
    $("#title").textContent="Impostazioni"; $("#subtitle").textContent="";
    v.innerHTML = `
      <div class="label">Capi</div>
      <div class="card"><div class="chips">${vocab.capi.map((c,i)=>`<button class="chip" data-rmv="capi:${i}">${esc(c)}<span class="x">×</span></button>`).join("")}</div>
      <div class="addrow"><input id="newCapo" placeholder="Nuovo capo, es. trench"><button data-addv="capi">Aggiungi</button></div></div>
      <div class="label">Colori</div>
      <div class="card"><div class="chips">${vocab.colori.map((c,i)=>`<button class="chip" data-rmv="colori:${i}">${swatch(c)}${esc(c)}<span class="x">×</span></button>`).join("")}</div>
      <div class="addrow"><input id="newColore" placeholder="Nuovo colore, es. senape"><button data-addv="colori">Aggiungi</button></div></div>
      <div class="label">Backup</div>
      <div class="card"><p class="hint" style="margin:0 0 12px">Le foto restano solo su questo iPhone. Esporta un backup ogni tanto (salvalo su File o Dropbox).</p>
      <div class="row"><button class="btn sec" id="exportBtn">Esporta</button><button class="btn sec" id="importBtn">Importa</button></div></div>
      <p class="hint" style="text-align:center">${photos.length} foto · ${usedTags().length} tag diversi</p>`;
  }
}

/* ---------- Dettaglio ---------- */
function openDetail(id){
  const p = photos.find(x=>x.id===id); if(!p) return;
  const s = $("#detail");
  s.innerHTML = `<div class="bar"><button data-close="detail">Chiudi</button><b></b><button data-edit="${p.id}">Modifica</button></div>
    <div class="body"><img class="hero" src="${urlOf(p)}" alt="">
    <div class="label">Tag · tocca per vedere foto simili</div>
    <div class="chips">${p.tags.length ? p.tags.map(t=>`<button class="chip tag" data-go="${esc(tagKey(t))}">${swatch(t.colore)}${esc(t.capo)} · ${esc(t.colore)}</button>`).join("") : `<span class="hint">Nessun tag</span>`}</div>
    ${p.tags.length>1?`<div style="margin-top:14px"><button class="btn sec" data-goall="${p.id}">Cerca foto con tutti questi capi</button></div>`:""}
    ${p.note?`<div class="label">Note</div><div class="card">${esc(p.note)}</div>`:""}
    <div class="hint" style="margin-top:18px">Aggiunta il ${new Date(p.created).toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"})}</div></div>`;
  s.scrollTop=0; s.classList.add("open");
}

/* ---------- Editor (aggiungi / modifica) ---------- */
let queue = [], draft = null;
function openEditor(p){
  draft = {...p, tags:[...p.tags]}; pick = {capo:null, colore:null};
  renderEditor(); $("#editor").scrollTop=0; $("#editor").classList.add("open");
}
function renderEditor(){
  const d = draft, isNew = !photos.some(x=>x.id===d.id);
  const left = queue.length ? ` (${queue.length} in coda)` : "";
  $("#editor").innerHTML = `<div class="bar"><button data-cancel>Annulla</button><b>${isNew?"Nuova foto":"Modifica"}${left}</b><button data-save>Salva</button></div>
  <div class="body">
    <img class="hero" src="${d._url || urlOf(d)}" alt="">
    <div class="label">Tag assegnati</div>
    <div class="chips">${d.tags.length ? d.tags.map((t,i)=>`<button class="chip on" data-rmt="${i}">${swatch(t.colore)}${esc(t.capo)} · ${esc(t.colore)}<span class="x">×</span></button>`).join("") : `<span class="hint">Scegli un capo e poi il suo colore: il tag si aggiunge da solo.</span>`}</div>
    <div class="label">Aggiungi tag</div>
    <div class="picker">
      <div class="label">1 · Capo</div>
      <div class="chips">${vocab.capi.map(c=>`<button class="chip ${pick.capo===c?"on":""}" data-pc="${esc(c)}">${esc(c)}</button>`).join("")}</div>
      <div class="label">2 · Colore</div>
      <div class="chips">${vocab.colori.map(c=>`<button class="chip ${pick.colore===c?"on":""}" data-pk="${esc(c)}">${swatch(c)}${esc(c)}</button>`).join("")}</div>
    </div>
    <div class="label">Note / fonte (facoltativo)</div>
    <input class="note" id="noteIn" value="${esc(d.note||"")}" placeholder="es. Pinterest, look da ufficio">
    ${isNew?"":`<div style="margin-top:22px"><button class="btn danger" data-del="${d.id}">Elimina foto</button></div>`}
  </div>`;
}
async function nextInQueue(){
  if(!queue.length){ draft=null; $("#editor").classList.remove("open"); render(); return; }
  const file = queue.shift();
  try{
    const blob = await resize(file);
    openEditor({id:uid(), created:Date.now(), blob, tags:[], note:"", _url:URL.createObjectURL(blob)});
  }catch(e){ toast("Immagine non leggibile"); nextInQueue(); }
}
function loadImg(file){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file), i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=u; }); }
async function resize(file, max=1400){
  const i = await loadImg(file);
  const s = Math.min(1, max/Math.max(i.naturalWidth, i.naturalHeight));
  const c = document.createElement("canvas"); c.width=Math.round(i.naturalWidth*s); c.height=Math.round(i.naturalHeight*s);
  c.getContext("2d").drawImage(i,0,0,c.width,c.height); URL.revokeObjectURL(i.src);
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(),"image/jpeg",.85));
}

/* ---------- Dialog di conferma ---------- */
function ask(msg, okLabel){
  return new Promise(res=>{
    $("#dialogCard").innerHTML = `<p>${esc(msg)}</p><button class="btn" style="background:#B3261E" id="dOk">${esc(okLabel)}</button><button class="btn sec" id="dNo">Annulla</button>`;
    $("#dialog").classList.add("open");
    $("#dOk").onclick=()=>{ $("#dialog").classList.remove("open"); res(true); };
    $("#dNo").onclick=()=>{ $("#dialog").classList.remove("open"); res(false); };
  });
}

/* ---------- Backup ---------- */
const blobToData = b => new Promise(r=>{ const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(b); });
async function exportBackup(){
  toast("Preparo il backup…");
  const out = {app:"outfit-ispirazioni", v:1, vocab, photos: await Promise.all(photos.map(async p=>({id:p.id, created:p.created, tags:p.tags, note:p.note||"", img: await blobToData(p.blob)})))};
  const file = new File([JSON.stringify(out)], `outfit-backup-${new Date().toISOString().slice(0,10)}.json`, {type:"application/json"});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file]}); return; }
  }catch(e){ if(e.name==="AbortError") return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=file.name; a.click();
}
async function importBackup(file){
  try{
    const data = JSON.parse(await file.text());
    if(!Array.isArray(data.photos)) throw 0;
    for(const p of data.photos){
      const blob = await (await fetch(p.img)).blob();
      await dbPut({id:p.id, created:p.created, tags:p.tags||[], note:p.note||"", blob});
    }
    if(data.vocab){ vocab = {capi:[...new Set([...vocab.capi,...data.vocab.capi])], colori:[...new Set([...vocab.colori,...data.vocab.colori])]}; await metaPut("vocab",vocab); }
    photos = await dbAll(); render(); toast(`Importate ${data.photos.length} foto`);
  }catch(e){ toast("File di backup non valido"); }
}

/* ---------- Eventi ---------- */
document.addEventListener("click", async e=>{
  const b = e.target.closest("button"); if(!b) return;
  const d = b.dataset;
  if(d.tab){ tab=d.tab; pick={capo:null,colore:null}; building=(tab==="search"&&!filters.length); render(); window.scrollTo(0,0); return; }
  if(d.open){ openDetail(d.open); return; }
  if(d.close){ $("#"+d.close).classList.remove("open"); return; }
  // ricerca
  if(d.sc!==undefined){ pick.capo = pick.capo===d.sc?null:d.sc; render(); return; }
  if(d.sk!==undefined){ pick.colore = pick.colore===d.sk?null:d.sk; render(); return; }
  if(b.id==="addFilter"){ const f={...pick}; if(!filters.some(x=>x.capo===f.capo&&x.colore===f.colore)) filters.push(f); pick={capo:null,colore:null}; building=false; render(); return; }
  if(b.id==="toggleBuilder"){ building=!building; pick={capo:null,colore:null}; render(); return; }
  if(d.rmf!==undefined){ filters.splice(+d.rmf,1); render(); return; }
  if(d.go){ const [capo,colore]=d.go.split("|"); filters=[{capo,colore}]; goSearch(); return; }
  if(d.gocapo){ filters=[{capo:d.gocapo,colore:null}]; goSearch(); return; }
  if(d.gocol){ filters=[{capo:null,colore:d.gocol}]; goSearch(); return; }
  if(d.goall){ const p=photos.find(x=>x.id===d.goall); filters=p.tags.map(t=>({...t})); goSearch(); return; }
  // editor
  if(d.edit){ const p=photos.find(x=>x.id===d.edit); $("#detail").classList.remove("open"); openEditor(p); return; }
  if(d.pc!==undefined){ pick.capo = pick.capo===d.pc?null:d.pc; tryAddTag(); return; }
  if(d.pk!==undefined){ pick.colore = pick.colore===d.pk?null:d.pk; tryAddTag(); return; }
  if(d.rmt!==undefined){ draft.note=$("#noteIn").value; draft.tags.splice(+d.rmt,1); renderEditor(); return; }
  if(d.cancel!==undefined){ if(draft && draft._url) URL.revokeObjectURL(draft._url); queue=[]; draft=null; $("#editor").classList.remove("open"); return; }
  if(d.save!==undefined){
    draft.note = $("#noteIn").value.trim();
    const {_url, ...p} = draft; await dbPut(p);
    const i = photos.findIndex(x=>x.id===p.id); if(i>=0) photos[i]=p; else photos.push(p);
    if(_url){ urls.set(p.id,_url); }
    toast("Salvata"); nextInQueue(); return;
  }
  if(d.del){
    if(!(await ask("Eliminare questa foto? L'operazione non si può annullare.","Elimina"))) return;
    await dbDel(d.del); photos=photos.filter(x=>x.id!==d.del); draft=null; queue=[];
    $("#editor").classList.remove("open"); render(); toast("Eliminata"); return;
  }
  // impostazioni
  if(d.rmv){ const [k,i]=d.rmv.split(":"); vocab[k].splice(+i,1); await metaPut("vocab",vocab); render(); return; }
  if(d.addv){ const inp=$(d.addv==="capi"?"#newCapo":"#newColore"); const val=inp.value.trim().toLowerCase(); if(val && !vocab[d.addv].includes(val)){ vocab[d.addv].push(val); await metaPut("vocab",vocab); render(); } return; }
  if(b.id==="exportBtn"){ exportBackup(); return; }
  if(b.id==="importBtn"){ $("#importFile").click(); return; }
});
function goSearch(){ $("#detail").classList.remove("open"); tab="search"; building=false; pick={capo:null,colore:null}; render(); }
function tryAddTag(){
  draft.note=$("#noteIn").value;
  if(pick.capo && pick.colore){
    const t={capo:pick.capo, colore:pick.colore};
    if(!draft.tags.some(x=>tagKey(x)===tagKey(t))) draft.tags.push(t);
    pick={capo:null,colore:null};
  }
  const y=$("#editor").scrollTop; renderEditor(); $("#editor").scrollTop=y;
}
$("#addBtn").onclick = () => $("#file").click();
$("#file").onchange = e => { queue=[...e.target.files]; e.target.value=""; nextInQueue(); };
$("#importFile").onchange = e => { const f=e.target.files[0]; e.target.value=""; if(f) importBackup(f); };

/* ---------- Avvio ---------- */
(async()=>{
  try{
    const v = await metaGet("vocab"); if(v) vocab=v;
    photos = await dbAll();
    if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  }catch(e){ toast("Archivio non disponibile in questo browser"); }
  render();
})();
if("serviceWorker" in navigator){ try{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){} }
</script>
</body>
